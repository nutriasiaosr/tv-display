<!DOCTYPE html>
<html>
<body style="margin:0;background:black">

<div id="viewer" style="color:white;text-align:center;margin-top:40vh;font-size:30px">
Loading content...
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxrztCrUkTtmmcgxDEr6kN6lOg2ILI-UYi8mqKL9mfzRLhr6Z2lUsuch-57_17sy3qk/exec";

let files=[];
let i=0;

async function start(){

let res=await fetch(API);
files=await res.json();

if(files.length===0){
document.getElementById("viewer").innerHTML="No media found";
return;
}

play();
setInterval(play,8000);
setInterval(loadFiles,300000);
}

async function loadFiles(){
let res=await fetch(API);
files=await res.json();
}

function play(){

let file=files[i].url;
let viewer=document.getElementById("viewer");

if(file.match(/\.mp4/i)){
viewer.innerHTML=`<video autoplay muted style="width:100vw;height:100vh"><source src="${file}"></video>`;
}else{
viewer.innerHTML=`<img src="${file}" style="width:100vw;height:100vh;object-fit:contain">`;
}

i=(i+1)%files.length;
}

start();

</script>
</body>
</html>
