<!DOCTYPE html>
<html>
<body style="margin:0;background:black">

<div id="viewer" style="color:white;text-align:center;margin-top:40vh;font-size:30px">
Loading...
</div>

<script>

let files=[];
let i=0;

function loadJSON(data){
files=data;
play();
setInterval(play,8000);
setInterval(loadScript,300000);
}

function play(){

if(files.length===0)return;

let file=files[i].url;
let viewer=document.getElementById("viewer");

if(file.match(/\.mp4/i)){
viewer.innerHTML=`<video autoplay muted style="width:100vw;height:100vh"><source src="${file}"></video>`;
}else{
viewer.innerHTML=`<img src="${file}" style="width:100vw;height:100vh;object-fit:contain">`;
}

i=(i+1)%files.length;
}

function loadScript(){
let s=document.createElement("script");
s.src="https://script.google.com/macros/s/AKfycbxrztCrUkTtmmcgxDEr6kN6lOg2ILI-UYi8mqKL9mfzRLhr6Z2lUsuch-57_17sy3qk/exec?callback=loadJSON";
document.body.appendChild(s);
}

loadScript();

</script>

</body>
</html>
